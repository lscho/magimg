# 幻画 AI · 跨平台构建流水线
#
# 触发方式：推送 v* 格式的 Tag（如 v1.0.0）时自动构建。
# 构建目标（在 Linux 构建节点上交叉编译）：
#   - Windows x86_64   (nsis 安装包)
#   - Windows aarch64  (nsis 安装包)
#   - macOS   x86_64   (app + dmg)
#   - macOS   aarch64  (app + dmg)
# 构建产物会上传到当前 Issue #1 的附件中。
#
# 说明：CNB 语义校验要求 tag_push 等仓库级事件必须放在 "$" 兜底分支下；
# 因此统一在 "$" 下用 if 条件（放到 stage 级）筛选 v* Tag 后再分发到 4 条并行流水线。

$:
  tag_push:
    # ── Windows x86_64 ──────────────────────────────────
    - name: win-x86_64
      docker:
        build: .cnb/Dockerfile.tauri-build
        volumes:
          - cargo-registry:/root/.cargo/registry:rw
          - node_modules
      stages:
        - name: guard
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: echo "building windows x86_64 for $CNB_BRANCH"
        - name: prepare
          script:
            - npm ci --no-audit --no-fund
            - npm run build
            - 'sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${CNB_BRANCH#v}\"/" src-tauri/tauri.conf.json'
            - grep '"version"' src-tauri/tauri.conf.json | head -1
        - name: build
          # 使用项目 devDependency 中的 @tauri-apps/cli（已在 prepare 的 npm ci 安装），
          # 通过 npm run tauri 调用，避免依赖全局 tauri 是否在 PATH。
          script:
            - npm run tauri build -- --target x86_64-pc-windows-gnu --bundles nsis
        - name: upload
          script:
            - for f in src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*; do echo "uploading $f"; cnb issues upload-file --file "$f"; done

    # ── Windows aarch64 ─────────────────────────────────
    - name: win-aarch64
      docker:
        build: .cnb/Dockerfile.tauri-build
        volumes:
          - cargo-registry:/root/.cargo/registry:rw
          - node_modules
      stages:
        - name: guard
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: echo "building windows aarch64 for $CNB_BRANCH"
        - name: prepare
          script:
            - npm ci --no-audit --no-fund
            - npm run build
            - 'sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${CNB_BRANCH#v}\"/" src-tauri/tauri.conf.json'
            - grep '"version"' src-tauri/tauri.conf.json | head -1
        - name: build
          env:
            CARGO_BUILD_TARGET: aarch64-pc-windows-gnu
          script:
            # aarch64-pc-windows-gnu 虽为 Rust Tier-3 目标，但 stable 工具链已提供其
            # 预编译 rust-std。镜像中已通过 `rustup target add aarch64-pc-windows-gnu`
            # 注册，因此直接交叉编译即可，无需 nightly 与 -Zbuild-std（后者依赖当日
            # nightly 是否发布该目标 std，不稳定）。
            - npm run tauri build -- --target aarch64-pc-windows-gnu --bundles nsis
        - name: upload
          script:
            - for f in src-tauri/target/aarch64-pc-windows-gnu/release/bundle/nsis/*; do echo "uploading $f"; cnb issues upload-file --file "$f"; done

    # ── macOS x86_64 (Intel) ────────────────────────────
    - name: macos-x86_64
      docker:
        build: .cnb/Dockerfile.tauri-build
        volumes:
          - cargo-registry:/root/.cargo/registry:rw
          - node_modules
      stages:
        - name: guard
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: echo "building macOS x86_64 for $CNB_BRANCH"
        - name: prepare
          script:
            - npm ci --no-audit --no-fund
            - npm run build
            - 'sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${CNB_BRANCH#v}\"/" src-tauri/tauri.conf.json'
            - grep '"version"' src-tauri/tauri.conf.json | head -1
        - name: build
          env:
            CC: x86_64-apple-darwin20.4-clang
            CXX: x86_64-apple-darwin20.4-clang++
            MACOSX_DEPLOYMENT_TARGET: "10.13"
          script:
            # macOS 交叉编译在 Linux 构建节点上进行；Tauri CLI 的 --bundles 枚举按
            # 运行平台过滤，在非 macOS 平台上 `app` 不在允许集合内。`.app` 目录是
            # `dmg` 的组成部分会被自动产出，因此只显式请求 `dmg` 即可。
            - npm run tauri build -- --target x86_64-apple-darwin --bundles dmg
        - name: upload
          script:
            - for f in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*; do [ -e "$f" ] || continue; echo "uploading $f"; cnb issues upload-file --file "$f"; done

    # ── macOS aarch64 (Apple Silicon) ───────────────────
    - name: macos-aarch64
      docker:
        build: .cnb/Dockerfile.tauri-build
        volumes:
          - cargo-registry:/root/.cargo/registry:rw
          - node_modules
      stages:
        - name: guard
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: echo "building macOS aarch64 for $CNB_BRANCH"
        - name: prepare
          script:
            - npm ci --no-audit --no-fund
            - npm run build
            - 'sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${CNB_BRANCH#v}\"/" src-tauri/tauri.conf.json'
            - grep '"version"' src-tauri/tauri.conf.json | head -1
        - name: build
          env:
            CC: aarch64-apple-darwin20.4-clang
            CXX: aarch64-apple-darwin20.4-clang++
            MACOSX_DEPLOYMENT_TARGET: "10.13"
          script:
            # macOS 交叉编译在 Linux 构建节点上进行；Tauri CLI 的 --bundles 枚举按
            # 运行平台过滤，在非 macOS 平台上 `app` 不在允许集合内。`.app` 目录是
            # `dmg` 的组成部分会被自动产出，因此只显式请求 `dmg` 即可。
            - npm run tauri build -- --target aarch64-apple-darwin --bundles dmg
        - name: upload
          script:
            - for f in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*; do [ -e "$f" ] || continue; echo "uploading $f"; cnb issues upload-file --file "$f"; done

    # ── 收尾通知 ────────────────────────────────────────
    - name: done
      stages:
        - name: summary
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script:
            - echo All platform builds finished. Artifacts uploaded to issue 1.
