name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to build, for example 1.2.3
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: huanhua-windows-x64
            bundles: nsis
            upload_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: huanhua-windows-arm64
            bundles: nsis
            upload_path: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: huanhua-macos-x64
            updater_arch: x64
            bundles: app,dmg
            upload_path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.sig
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: huanhua-macos-arm64
            updater_arch: arm64
            bundles: app,dmg
            upload_path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare signed updater configuration
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/write-tauri-release-config.mjs

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, or APPLE_SIGNING_IDENTITY" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/huanhua-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "APPLE_SIGNING_IDENTITY does not match the imported certificate" >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing APPLE_API_ISSUER, APPLE_API_KEY, or APPLE_API_KEY_P8" >&2
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/huanhua-release/tauri.release.conf.json"

      - name: Build signed and notarized macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/huanhua-release/tauri.release.conf.json"

      - name: Add architecture suffix to macOS updater
        if: runner.os == 'macOS'
        shell: bash
        env:
          UPDATER_ARCH: ${{ matrix.updater_arch }}
          UPDATER_DIRECTORY: src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          shopt -s nullglob
          updater_files=("$UPDATER_DIRECTORY"/*.app.tar.gz)
          if [ "${#updater_files[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS updater, found ${#updater_files[@]}" >&2
            find "$UPDATER_DIRECTORY" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          updater_path="${updater_files[0]}"
          signature_path="${updater_path}.sig"
          if [ ! -s "$signature_path" ]; then
            echo "Missing or empty updater signature: $signature_path" >&2
            exit 1
          fi

          renamed_updater="${updater_path%.app.tar.gz}_${UPDATER_ARCH}.app.tar.gz"
          renamed_signature="${renamed_updater}.sig"
          if [ -e "$renamed_updater" ] || [ -e "$renamed_signature" ]; then
            echo "Architecture-specific updater already exists" >&2
            exit 1
          fi

          mv "$updater_path" "$renamed_updater"
          mv "$signature_path" "$renamed_signature"
          echo "Prepared $(basename "$renamed_updater")"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error
          retention-days: 14

  prepare-release:
    name: Prepare backend release manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: huanhua-*
          path: release-artifacts

      - name: Validate bundles and create backend release manifest
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_ARTIFACTS_DIR: release-artifacts
          RELEASE_MANIFEST_PATH: release-manifest/huanhua-desktop-release-manifest.json
          PUBLISH_GITHUB_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: node scripts/build-desktop-release-manifest.mjs

      - name: Upload backend release manifest
        uses: actions/upload-artifact@v4
        with:
          name: huanhua-desktop-release-manifest
          path: release-manifest/huanhua-desktop-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-artifacts -type f -print0)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release files found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --generate-notes \
              --title "幻画 AI $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
