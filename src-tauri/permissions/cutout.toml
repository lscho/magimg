[[permission]]
identifier = "allow-cutout-inference"
description = "Allow the main window to run cutout inference, SAM automatic proposals, background repair, and release native sessions."
commands.allow = [
  "cutout_encode",
  "cutout_decode",
  "cutout_auto_propose",
  "cutout_refine",
  "cutout_repair",
  "cutout_birefnet_segment",
  "cutout_cancel",
  "cutout_release",
]
